<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>GameVault - Minha coleção</title>
</head>
<body>

  <header>
    <h1>GameVault</h1>
    <ul>
      <li><a href="index.html" class="atual">Minha coleção</a></li>
      <li><a href="pages/cadastro.html">Adicionar jogo</a></li>
    </ul>
  </header>

  <main class="layout-colecao">
    <section class="filtros">
      <h2>Pesquisar, filtrar e ordenar</h2>
      <form id="form-filtros">
        <p>
          <label for="busca">Título:</label>
          <input type="search" id="busca">
        </p>
        <p>
          <label for="plataforma">Plataforma:</label>
          <select id="plataforma">
            <option value="">Todas</option>
            <option value="PC">PC</option>
            <option value="PlayStation">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo Switch">Nintendo Switch</option>
            <option value="Mobile">Mobile</option>
          </select>
        </p>
        <p>
          <label for="status">Status:</label>
          <select id="status">
            <option value="">Todos</option>
            <option value="Quero jogar">Quero jogar</option>
            <option value="Jogando">Jogando</option>
            <option value="Zerado">Zerado</option>
          </select>
        </p>
        <p>
          <label for="ordem">Ordenar por:</label>
          <select id="ordem">
            <option value="titulo">Título (A-Z)</option>
            <option value="nota">Maior nota</option>
            <option value="horas">Mais horas jogadas</option>
          </select>
        </p>
        <button type="submit">Aplicar</button>
      </form>
    </section>

    <section class="lista">
      <h2>Jogos cadastrados</h2>
      <p id="aviso-vazio" class="mensagem vazio" hidden></p>
      <div class="tabela" id="area-tabela">
        <table>
          <thead>
            <tr>
              <th>Capa</th>
              <th>Título</th>
              <th>Plataforma</th>
              <th>Status</th>
              <th>Nota</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-jogos">
          </tbody>
        </table>
      </div>
    </section>

    <aside class="resumo">
      <h2>Resumo</h2>
      <ul>
        <li>Total de jogos: <span id="resumo-total">0</span></li>
        <li>Jogos zerados: <span id="resumo-zerados">0</span></li>
        <li>Horas jogadas: <span id="resumo-horas">0</span></li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>GameVault</p>
  </footer>

  <script src="assets/js/script.js"></script>
  <script src="assets/js/lista.js"></script>
</body>
</html>
