<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <title>GameVault - Adicionar jogo</title>
</head>
<body>

  <header>
    <h1>GameVault</h1>
    <ul>
      <li><a href="../index.html">Minha coleção</a></li>
      <li><a href="cadastro.html" class="atual">Adicionar jogo</a></li>
    </ul>
  </header>

  <main>
    <section>
      <h2>Buscar jogo na CheapShark</h2>
      <p class="mensagem info">Opcional: busque o jogo para preencher o título, a capa e o menor preço automaticamente.</p>
      <p id="mensagem-api" class="mensagem" hidden></p>
      <form id="form-api">
        <p>
          <label for="busca-api">Nome do jogo:</label>
          <input type="text" id="busca-api" placeholder="Ex.: Hollow Knight">
        </p>
        <button type="submit">Buscar na API</button>
      </form>
      <ul id="resultados" class="resultados"></ul>
    </section>

    <section>
      <h2>Adicionar jogo</h2>
      <p id="mensagem" class="mensagem" hidden></p>
      <form id="form-jogo" novalidate>
        <p>
          <label for="titulo">Título:</label>
          <input type="text" id="titulo" required>
        </p>
        <p>
          <label for="plataforma">Plataforma:</label>
          <select id="plataforma" required>
            <option value="">Escolha</option>
            <option value="PC">PC</option>
            <option value="PlayStation">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo Switch">Nintendo Switch</option>
            <option value="Mobile">Mobile</option>
          </select>
        </p>
        <p>
          <label for="genero">Gênero:</label>
          <input type="text" id="genero" placeholder="Ex.: RPG" required>
        </p>
        <p>
          <label for="status">Status:</label>
          <select id="status">
            <option value="Quero jogar">Quero jogar</option>
            <option value="Jogando">Jogando</option>
            <option value="Zerado">Zerado</option>
          </select>
        </p>
        <p>
          <label for="nota">Nota (0 a 10):</label>
          <input type="number" id="nota" min="0" max="10" step="0.5" value="0">
        </p>
        <p>
          <label for="horas">Horas jogadas:</label>
          <input type="number" id="horas" min="0" value="0">
        </p>
        <p>
          <label for="comentario">Comentário:</label>
          <textarea id="comentario" rows="4"></textarea>
        </p>
        <input type="hidden" id="capa">
        <input type="hidden" id="preco">
        <button type="submit">Salvar jogo</button>
        <a class="voltar" href="../index.html">Voltar para a coleção</a>
      </form>
    </section>
  </main>

  <footer>
    <p>GameVault</p>
  </footer>

  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/cadastro.js"></script>
</body>
</html>
