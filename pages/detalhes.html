<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <title>GameVault - Detalhes</title>
</head>
<body>

  <header>
    <h1>GameVault</h1>
    <ul>
      <li><a href="../index.html">Minha coleção</a></li>
      <li><a href="cadastro.html">Adicionar jogo</a></li>
    </ul>
  </header>

  <main>
    <section>
      <h2>Detalhes do jogo</h2>
      <p id="mensagem" class="mensagem" hidden></p>
      <article class="detalhe-jogo" id="area-detalhes">
        <h3 id="det-titulo"></h3>
        <div class="conteudo">
          <img id="det-capa" src="../assets/img/capa-exemplo.jpg" alt="Capa do jogo" width="120">
          <div class="dados">
            <ul>
              <li><strong>Plataforma:</strong> <span id="det-plataforma"></span></li>
              <li><strong>Gênero:</strong> <span id="det-genero"></span></li>
              <li><strong>Status:</strong> <span id="det-status"></span></li>
              <li><strong>Nota:</strong> <span id="det-nota"></span></li>
              <li><strong>Horas jogadas:</strong> <span id="det-horas"></span></li>
              <li><strong>Menor preço:</strong> <span id="det-preco"></span></li>
            </ul>
            <p><strong>Comentário:</strong> <span id="det-comentario"></span></p>
            <div class="acoes">
              <a id="btn-editar" href="editar.html">Editar</a>
              <button type="button" id="btn-preco">Atualizar preço</button>
              <button type="button" class="perigo" id="btn-excluir">Excluir</button>
            </div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>GameVault</p>
  </footer>

  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/detalhes.js"></script>
</body>
</html>
